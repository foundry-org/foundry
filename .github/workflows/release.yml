# Build foundry-core wheels and the sdist; on a v* tag (or a manual run with
# publish=yes) upload the PyPI-CUDA wheels + sdist to PyPI through trusted
# publishing, attach every wheel to a GitHub Release and list them in the
# per-CUDA package index on the gh-pages branch (whl/<cuda>/,
# pip --extra-index-url). foundry.ops uses only the LibTorch Stable ABI, so one
# wheel per (CPython, CUDA major) serves every torch >= the stable-ABI target.
# See docs/release.md.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      cuda:
        description: "torch CUDA tag to build, e.g. cu128 (empty: every entry in BUILD_CUDAS)"
        required: false
        default: ""
      torch:
        description: "build torch for that CUDA tag, e.g. 2.14.1 (required with cuda; its major.minor must be the stable-ABI target)"
        required: false
        default: ""
      publish:
        description: "Publish to PyPI and create the GitHub Release"
        type: choice
        options: ["no", "yes"]
        default: "no"

permissions:
  contents: read

env:
  # Release matrix: PYTHONS x BUILD_CUDAS, one wheel per (CPython, CUDA major).
  # "torch" is the torch the wheel is COMPILED with: its major.minor must be the
  # stable-ABI target (setup.py MIN_TORCH); every wheel requires torch>=<target>
  # and loads on any later torch with the same CUDA major. The FIRST entry is the
  # PyPI CUDA: its wheels carry the plain version (foundry-core X.Y.Z) and are
  # uploaded to PyPI. Every other entry is built with a local version
  # (X.Y.Z+cuNNN), since PyPI rejects local versions. Every wheel is attached to
  # the GitHub Release and listed in the package index of its CUDA, whl/<cuda>/
  # on the gh-pages branch, which users select with pip --extra-index-url.
  # "image" is optional; the default is
  # pytorch/manylinux2_28-builder:cuda<major.minor of the cuda tag>.
  PYTHONS: '["3.10", "3.11", "3.12", "3.13"]'
  BUILD_CUDAS: '[{"cuda": "cu130", "torch": "2.14.1"}]'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      publish: ${{ steps.plan.outputs.publish }}
      pypi_publish: ${{ steps.plan.outputs.pypi_publish }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the vendored Boost headers
        run: |
          if [ ! -f third_party/boost/boost/version.hpp ]; then
            echo "::error::third_party/boost is not populated. Run tools/release/vendor_boost.sh and commit third_party/boost before releasing (see docs/release.md)."
            exit 1
          fi
          grep -m1 'define BOOST_VERSION ' third_party/boost/boost/version.hpp
      - name: Compute the build matrix
        id: plan
        env:
          IN_TORCH: ${{ inputs.torch }}
          IN_CUDA: ${{ inputs.cuda }}
          IN_PUBLISH: ${{ inputs.publish }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys, tomllib

          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          m = re.search(r"^MIN_TORCH = \((\d+), (\d+)\)", open("setup.py").read(), re.MULTILINE)
          target = f"{m[1]}.{m[2]}"
          is_tag = os.environ["EVENT"] == "push" and os.environ["REF"].startswith("refs/tags/v")
          if is_tag and os.environ["REF_NAME"] != f"v{version}":
              print(f"::error::tag {os.environ['REF_NAME']} does not match pyproject version {version}")
              sys.exit(1)

          pythons = json.loads(os.environ["PYTHONS"])
          cudas = json.loads(os.environ["BUILD_CUDAS"])
          pypi_cuda = cudas[0]["cuda"]
          torch, cuda = os.environ.get("IN_TORCH", ""), os.environ.get("IN_CUDA", "")
          if torch or cuda:
              if not (torch and cuda):
                  print("::error::give both torch and cuda, or neither")
                  sys.exit(1)
              cudas = [{"torch": torch, "cuda": cuda}]
          if len({c["cuda"] for c in cudas}) != len(cudas):
              print("::error::one BUILD_CUDAS entry per CUDA tag")
              sys.exit(1)

          include = []
          for entry in cudas:
              if ".".join(entry["torch"].split(".")[:2]) != target:
                  print(f"::error::build torch {entry['torch']} is not the stable-ABI target {target} (setup.py MIN_TORCH)")
                  sys.exit(1)
              digits = entry["cuda"].removeprefix("cu")
              image = entry.get("image") or f"pytorch/manylinux2_28-builder:cuda{digits[:-1]}.{digits[-1]}"
              pypi = entry["cuda"] == pypi_cuda
              local = "" if pypi else entry["cuda"]
              for py in pythons:
                  include.append(dict(python=py, torch=entry["torch"], cuda=entry["cuda"],
                                      image=image, pypi=pypi, local_version=local))

          publish = is_tag or os.environ.get("IN_PUBLISH") == "yes"
          # PyPI gets the plain-version CUDA only; a manual build of another
          # CUDA publishes to the GitHub Release alone.
          pypi_publish = publish and any(e["pypi"] for e in include)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"matrix={json.dumps({'include': include})}\n")
              out.write(f"publish={'true' if publish else 'false'}\n")
              out.write(f"pypi_publish={'true' if pypi_publish else 'false'}\n")
              out.write(f"version={version}\n")
          print(json.dumps(include, indent=1), "publish:", publish, "pypi:", pypi_publish)
          PY

  sdist:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the sdist
        # setup.py imports torch and constructs the CUDAExtension; an sdist
        # compiles nothing, so a CPU torch and a placeholder CUDA_HOME suffice.
        run: |
          python -m pip install -U pip build "setuptools>=80" wheel "cmake>=4.0" ninja
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          # FOUNDRY_SDIST=1: setup.py declares no extension and does not import
          # torch.utils.cpp_extension, so no CUDA toolkit is needed here.
          FOUNDRY_SDIST=1 python -m build --sdist --no-isolation
      - name: Check the sdist contents
        run: |
          tar tzf dist/foundry_core-*.tar.gz > sdist.txt
          for f in CMakeLists.txt csrc/hook.cpp csrc/boost_json_src.cpp include/hook.h \
                   third_party/boost/boost/version.hpp third_party/boost/LICENSE_1_0.txt \
                   python/foundry/_build_info.py.in; do
            grep -q "/$f\$" sdist.txt || { echo "::error::sdist is missing $f"; exit 1; }
          done
          if grep -E '\.so$|/_build_info\.py$' sdist.txt; then
            echo "::error::sdist contains build outputs"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    needs: plan
    name: wheel py${{ matrix.python }} ${{ matrix.cuda }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the builder image
        # The pytorch manylinux builder image is ~8 GB compressed; torch is
        # downloaded into it as well. It runs through `docker run` in the
        # next step (not `container:`) so this cleanup happens before the pull.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - name: Build, repair, check and smoke-test the wheel
        env:
          FOUNDRY_BUILDER_IMAGE: ${{ matrix.image }}
          MAX_JOBS: "4"
          LOCAL_VERSION: ${{ matrix.local_version }}
        run: |
          extra=()
          if [ -n "$LOCAL_VERSION" ]; then extra=(--local-version "$LOCAL_VERSION"); fi
          tools/release/build_wheel.sh --docker \
            --python "${{ matrix.python }}" --torch "${{ matrix.torch }}" --cuda "${{ matrix.cuda }}" \
            --out wheelhouse "${extra[@]}"
          ls -l wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.pypi && 'pypi' || 'ghrelease' }}-py${{ matrix.python }}-${{ matrix.cuda }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    needs: [plan, sdist, wheels]
    if: needs.plan.outputs.pypi_publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/foundry-core/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-pypi-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: List the PyPI upload
        run: |
          ls -l dist
          if ls dist/*.whl | grep -F '+'; then
            echo "::error::a local-version wheel reached the PyPI upload"; exit 1
          fi
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: [plan, sdist, wheels, publish]
    # Runs after the PyPI upload, or without it when only a non-PyPI CUDA was built.
    if: >-
      always() && needs.plan.outputs.publish == 'true'
      && needs.sdist.result == 'success' && needs.wheels.result == 'success'
      && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
          INDEX_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/whl
        run: |
          tag="v$VERSION"
          ls -l dist
          cat > notes.md <<NOTES
          foundry-core $VERSION. Release notes: RELEASE.md in this tag.

          PyPI wheels (\`pip install foundry-core==$VERSION\`) are built for the first CUDA of
          \`$BUILD_CUDAS\` (CPython 3.10-3.13, manylinux_2_28 x86_64). One wheel per CPython serves
          every torch >= the LibTorch Stable ABI target (Requires-Dist torch>=A.B, no upper bound)
          with that CUDA major. Wheels with a local version (\`+cuNNN\`) target other CUDA majors and
          have a package index each:
          \`pip install foundry-core==$VERSION --extra-index-url $INDEX_URL/<cuda>/\`,
          or install the wheel by URL from this page.
          NOTES
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "foundry-core $VERSION" \
              --notes-file notes.md --target "$GITHUB_SHA"
          fi

  index:
    # Per-CUDA package indexes (PEP 503) on the gh-pages branch:
    # whl/<cuda>/foundry-core/ lists every released stable-ABI wheel of that
    # CUDA, linking to the GitHub Release assets with their sha256. Wheels of
    # releases up to 0.1.0rc4 (one per torch pair, manifest "torch" = A.B) stay
    # in their old whl/<cuda>/torch<A.B>/ indexes. The manifest
    # whl/manifest.json accumulates across releases; the HTML is regenerated
    # from it on every run.
    needs: [plan, release]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Check out the gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"
          if git ls-remote --exit-code --heads "$url" gh-pages >/dev/null; then
            git clone --quiet --branch gh-pages --single-branch "$url" pages
          else
            git init --quiet -b gh-pages pages
            git -C pages remote add origin "$url"
          fi
      - name: Update the manifest and regenerate the indexes
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
          VERSION: ${{ needs.plan.outputs.version }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib, html, json, os, re, urllib.parse
          from pathlib import Path

          repo, version = os.environ["GH_REPO"], os.environ["VERSION"]
          entries = json.loads(os.environ["MATRIX"])["include"]
          root = Path("pages/whl")
          root.mkdir(parents=True, exist_ok=True)
          manifest_path = root / "manifest.json"
          manifest = json.loads(manifest_path.read_text()) if manifest_path.exists() else {}

          def cuda_of(name):
              """CUDA tag of a wheel from this run's matrix."""
              m = re.match(r"foundry_core-(?P<ver>[^-]+)-cp(?P<py>\d+)-", name)
              ver, py = m["ver"], m["py"]
              local = ver.split("+", 1)[1] if "+" in ver else ""
              for e in entries:
                  if e["python"].replace(".", "") == py and e["local_version"] == local:
                      return e["cuda"]
              raise SystemExit(f"no matrix entry for {name}")

          for wheel in sorted(Path("dist").glob("*.whl")):
              # "torch": "" = one wheel for every torch >= the stable-ABI target.
              manifest[wheel.name] = {
                  "version": version, "cuda": cuda_of(wheel.name), "torch": "",
                  "sha256": hashlib.sha256(wheel.read_bytes()).hexdigest(),
                  "url": f"https://github.com/{repo}/releases/download/v{version}/"
                         + urllib.parse.quote(wheel.name),
              }
          manifest_path.write_text(json.dumps(manifest, indent=1, sort_keys=True) + "\n")

          head = ('<!DOCTYPE html><html><head><meta charset="utf-8">'
                  '<meta name="pypi:repository-version" content="1.0"><title>{}</title></head><body>')
          # (cuda, "") = stable-ABI wheels, index whl/<cuda>/; (cuda, "A.B") = per-torch wheels
          # of releases up to 0.1.0rc4, index whl/<cuda>/torch<A.B>/ (kept, no longer extended).
          groups = sorted({(m["cuda"], m["torch"]) for m in manifest.values()})
          def rel(cuda, torch_mm):
              return f"{cuda}/torch{torch_mm}" if torch_mm else cuda
          for cuda, torch_mm in groups:
              d = root / rel(cuda, torch_mm)
              (d / "foundry-core").mkdir(parents=True, exist_ok=True)
              files = sorted(n for n, m in manifest.items() if (m["cuda"], m["torch"]) == (cuda, torch_mm))
              links = "".join(
                  f'<a href="{html.escape(manifest[n]["url"])}#sha256={manifest[n]["sha256"]}">{html.escape(n)}</a><br>\n'
                  for n in files)
              title = f"foundry-core {rel(cuda, torch_mm)}"
              (d / "foundry-core" / "index.html").write_text(
                  head.format(title) + f"<h1>{title}</h1>\n{links}</body></html>\n")
              (d / "index.html").write_text(
                  head.format(f"{title} index") + '<a href="foundry-core/">foundry-core</a><br>\n</body></html>\n')
          listing = "".join(f'<a href="{rel(c, t)}/">{rel(c, t)}/</a><br>\n' for c, t in groups)
          (root / "index.html").write_text(
              head.format("foundry-core wheel indexes") + "<h1>foundry-core wheel indexes</h1>\n"
              "<p>pip install foundry-core --extra-index-url &lt;this page&gt;/&lt;cuda&gt;/</p>\n"
              + listing + "</body></html>\n")
          (Path("pages") / ".nojekyll").touch()
          print("\n".join(f"{rel(c, t)}: " + ", ".join(n for n, m in manifest.items() if (m['cuda'], m['torch']) == (c, t)) for c, t in groups))
          PY
      - name: Push gh-pages
        run: |
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "index unchanged"; exit 0; }
          git commit -q -m "whl index: foundry-core ${{ needs.plan.outputs.version }}"
          git push origin gh-pages
