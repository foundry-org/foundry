mode = "load"
base_addr = 0x600000000000
region_size = "256GB"
workspace_root = "foundry_archive"
scratch_space_size = "1024MB"
# EP needs DeepEP's NVSHMEM host lib preloaded. Foundry auto-detects it from the
# torch-bundled nvidia-nvshmem wheel (like it auto-detects libcuda_hook.so), so
# leave this unset. Set it only to override that with a custom NVSHMEM build:
# nvshmem_host_path = "/abs/path/to/libnvshmem_host.so.3"

# Bare host (no container) where /dev/infiniband/uverbs* exist but open() is
# denied: DeepEP's first NVSHMEM init waits 5 s per HCA for udev (~40 s per
# engine). Point this at the preload shim built from tools/host/no_cdev_wait.c
# (`make -C tools/host`) and Foundry adds it to LD_PRELOAD next to libcuda_hook.so.
# See docs/bare-host-verbs-udev-wait.md. Leave unset in containers / with usable HCAs.
# verbs_udev_wait_shim_path = "/abs/path/to/libno_cdev_wait.so"
