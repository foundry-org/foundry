# foundry.ops is a torch C++/CUDA extension: it must be compiled against the torch
# that will import it. Install with --no-build-isolation into an environment that
# already has that torch (and cmake>=4.0, ninja); an isolated build would compile
# against whatever torch pip resolves here, not the runtime one.
[build-system]
requires = [
    "setuptools>=80",
    "wheel",
    "cmake>=4.0",
    "ninja",
    "torch",
]
build-backend = "setuptools.build_meta"

[project]
# Distribution name on PyPI; the import name stays `foundry`.
name = "foundry-core"
version = "0.1.0"
description = "Foundry: CUDA graph persistence for LLM serving engines (save captured CUDA graphs, restore them at startup)"
readme = "README.md"
# Apache-2.0 (LICENSE, picked up by setuptools' default license-files globs);
# no `license` key so older setuptools in --no-build-isolation envs still parse this.
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Operating System :: POSIX :: Linux",
    "Environment :: GPU :: NVIDIA CUDA",
]
# setup.py sets install_requires: "torch" for a source build, "torch==X.Y.*"
# (the build torch) for a release wheel, since foundry.ops is bound to it.
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/foundry-org/foundry"
Source = "https://github.com/foundry-org/foundry"
Changelog = "https://github.com/foundry-org/foundry/blob/main/RELEASE.md"

# Plugin route: SGLang discovers general plugins through this entry-point group
# (sglang.srt.plugins.load_plugins). The entry module imports only the
# standard library; Foundry activates when FOUNDRY_GRAPH_EXTENSION_CONFIG is set.
# An SGLang that declares Foundry as a dependency (sglang[foundry],
# --cuda-graph-persistence) calls foundry.integration.sglang.api instead.
[project.entry-points."sglang.srt.plugins"]
foundry = "foundry_sglang_plugin:load"

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools]
packages = [
    "foundry",
    "foundry.integration",
    "foundry.integration.vllm",
    "foundry.integration.sglang",
]
py-modules = ["foundry_sglang_plugin"]
package-dir = {"" = "python"}
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
foundry = ["*.so", "*.pyi"]

# -----------------------------------------------------------------------------
# Lint / format
# -----------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "build",
    "dist",
    "*.egg-info",
    "python/foundry/_version.py",
    "python/foundry/_build_info.py",
    "third_party",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # Pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "ISC", # flake8-implicit-str-concat
    "SIM", # flake8-simplify
    "I",   # isort
    "G",   # flake8-logging-format
]
ignore = [
    # star imports
    "F405", "F403",
    # lambda expression assignment
    "E731",
    # zip without `strict=`
    "B905",
    # Loop control variable not used within loop body
    "B007",
    # f-string format
    "UP032",
]
# Lint-level autofix policy.
# F401 ("unused import") is reported but NEVER auto-stripped — re-export
# modules (foundry/__init__.py, allocation_region.py) hold imports that ruff
# can't see are public API. A `--fix` pass that removes them silently breaks
# the integration (vLLM serve "runs fine" without foundry hooks). Likewise
# F841 (unused-local) is report-only because tests often assign for clarity.
unfixable = ["F401", "F841"]

[tool.ruff.lint.per-file-ignores]
# Tests are allowed to leave dangling locals & long lines.
"tests/**" = ["E501", "F841"]
# Public re-exports: F401 (unused import) doesn't apply to __init__.
"**/__init__.py" = ["F401"]
# .pyi stubs commonly use overload-style redefinitions; ignore F811 and
# allow legacy Optional[X] / Union annotations for compatibility.
"**/*.pyi" = ["F811", "UP007"]

[tool.ruff.format]
docstring-code-format = true

# -----------------------------------------------------------------------------
# pytest
# -----------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "xlarge: 4-GPU, 100+ GB model end-to-end cases; deselected by default, run with -m xlarge",
]
addopts = "-m 'not xlarge'"
